services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: payment_gateway_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-payment_gateway}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_EXTERNAL:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-payment_gateway}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: ${RESTART_POLICY:-unless-stopped}

  # LocalStack for local AWS services (S3, SES)
  localstack:
    image: localstack/localstack:3.0
    container_name: payment_gateway_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,ses
      - DEBUG=${DEBUG:-0}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - PERSISTENCE=1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: ${RESTART_POLICY:-unless-stopped}

  # FastAPI Application
  web:
    build:
      context: .
      dockerfile: DOCKERFILE
    container_name: payment_gateway_app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000} ${UVICORN_RELOAD:---reload}"
    environment:
      - PAYMENT_GATEWAY_DATABASE_URL=postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-payment_gateway}
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - ${VOLUME_MOUNT:-.:/app}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: ${RESTART_POLICY:-unless-stopped}
    env_file:
      - .env

volumes:
  postgres_data:
  localstack_data:

networks:
  default:
    name: payment_gateway_network
